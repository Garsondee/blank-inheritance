<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stagecraft Bench</title>
  <link rel="stylesheet" href="/module/blank-inheritance/assets/fonts/fonts.css" onerror="this.remove()">
  <style>
    :root { --ink: #eadfc8; --brass: #e6c98d; --bg: #060403; --panel: rgba(14, 10, 6, 0.82); }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #panel { position: fixed; left: 12px; top: 12px; width: 300px; max-height: calc(100vh - 24px); overflow: auto; background: var(--panel); border: 1px solid rgba(230, 201, 141, 0.35); border-radius: 12px; padding: 10px 12px; z-index: 10; }
    #panel h1 { font-size: 13px; margin: 0 0 6px; color: var(--brass); letter-spacing: 0.08em; text-transform: uppercase; }
    #panel h2 { font-size: 11px; margin: 10px 0 4px; color: #b9a882; letter-spacing: 0.08em; text-transform: uppercase; }
    #panel select, #panel button { font: inherit; color: var(--ink); background: rgba(230, 201, 141, 0.1); border: 1px solid rgba(230, 201, 141, 0.35); border-radius: 999px; padding: 3px 10px; margin: 2px 2px 2px 0; cursor: pointer; }
    #panel select { border-radius: 6px; width: 100%; }
    #panel button.on { background: var(--brass); color: #1b1208; }
    #panel .note { color: #b9a882; font-size: 11px; margin-top: 8px; }
    #panel.hidden { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/module/stagecraft/node_modules/three/build/three.module.js",
        "three/addons/": "/module/stagecraft/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="panel">
    <h1>Stagecraft bench</h1>
    <select id="pick"></select>
    <h2>Switches</h2>
    <div id="switches"></div>
    <h2>Formations (shift-click cards to choose)</h2>
    <div id="formations"></div>
    <h2>Moments</h2>
    <div id="moments"></div>
    <h2>Triggers</h2>
    <div id="triggers"></div>
    <div class="note">Drag a card by its face to pick it up. Space hops, N nods. H hides this panel. This is the real engine and renderer with the scene's real stage entry.</div>
  </div>
  <script type="module" src="./bench.mjs"></script>
</body>
</html>
